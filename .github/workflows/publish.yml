name: publish-index

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'commands/**'
      - 'hooks/**'
      - 'mcp/**'
      - 'agents/**'
      - 'output-styles/**'
      - 'cmd/buildindex/**'
      - 'cmd/buildtrending/**'
      - 'internal/registry/**'
      - 'internal/skillssh/**'
      - 'internal/trending/**'
      - '.github/workflows/publish.yml'
  # Refresh the trending and hot snapshot every hour. The index is rebuilt too,
  # since gh-pages is republished whole.
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-index
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Compile index
        run: go run ./cmd/buildindex -out dist/index.json
      - name: Fetch the previous trending snapshot
        # Reused for descriptions, and republished if the new build fails.
        run: |
          curl -fsSL --retry 2 -o prev-trending.json \
            "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/trending.json" \
            || rm -f prev-trending.json
      - name: Build the trending snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A skills.sh outage or page change must not block the index, so a
        # failed build keeps the last good snapshot. The CLI warns once it is
        # more than six hours old.
        run: |
          if ! go run ./cmd/buildtrending -out dist/trending.json -previous prev-trending.json; then
            echo "::warning::trending snapshot build failed; republishing the previous snapshot"
            if [ -s prev-trending.json ]; then cp prev-trending.json dist/trending.json; fi
          fi
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
